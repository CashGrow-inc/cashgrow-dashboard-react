<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CashGrow | Beating the cost of living together</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root">
      <main
        class="min-h-screen bg-slate-50 p-6 py-12"
      >
        <div
          class="w-full max-w-3xl mx-auto bg-white/90 backdrop-blur-md border border-slate-200 rounded-3xl shadow-2xl p-6 md:p-8 space-y-4"
        >
          <div class="space-y-2 text-center">
            <p
              class="inline-flex items-center justify-center gap-2 text-[10px] font-semibold tracking-[0.45em] uppercase text-blue-600"
            >
              CashGrow Access Request
            </p>
            <h1 class="text-2xl md:text-3xl font-extrabold text-slate-800">
              Join the private beta waitlist
            </h1>
            <p class="text-sm text-slate-600 max-w-2xl mx-auto">
              Tell us how to reach you and we&rsquo;ll notify you the moment CashGrow opens early access.
            </p>
          </div>

          <form
            name="cashgrow-waitlist"
            method="POST"
            data-netlify="true"
            data-netlify-honeypot="bot-field"
            class="grid gap-3"
          >
            <input type="hidden" name="form-name" value="cashgrow-waitlist" />
            <p class="hidden">
              <label>
                Don&rsquo;t fill this out if you&rsquo;re human:
                <input name="bot-field" />
              </label>
            </p>

            <div class="grid gap-1">
              <label for="full-name" class="text-sm font-semibold text-slate-700 uppercase tracking-wide">
                Full Name
              </label>
              <input
                id="full-name"
                name="full-name"
                type="text"
                required
                placeholder="Jane Doe"
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
              />
            </div>

            <div class="grid gap-1">
              <label for="email" class="text-sm font-semibold text-slate-700 uppercase tracking-wide">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                required
                placeholder="you@email.com"
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
              />
            </div>

            <div class="grid gap-1">
              <label for="company" class="text-sm font-semibold text-slate-700 uppercase tracking-wide">
                Company (optional)
              </label>
              <input
                id="company"
                name="company"
                type="text"
                placeholder="Your organization"
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
              />
            </div>

            <div class="grid gap-1">
              <label for="message" class="text-sm font-semibold text-slate-700 uppercase tracking-wide">
                What would you like to accomplish with CashGrow?
              </label>
              <textarea
                id="message"
                name="message"
                rows="3"
                placeholder="Share a sentence or two so we can personalize the onboarding."
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50"
              ></textarea>
            </div>

            <button
              type="submit"
              class="w-full rounded-full bg-gradient-to-r from-blue-500 to-indigo-500 py-3 text-base font-semibold text-white tracking-wide shadow-lg shadow-blue-900/40 transition hover:from-blue-400 hover:to-indigo-400 focus:outline-none focus:ring-2 focus:ring-blue-500/70 focus:ring-offset-2 focus:ring-offset-white"
            >
              Request Access
            </button>
          </form>

          <p class="text-center text-xs text-slate-500">
            The full CashGrow dashboard will load once scripts are ready—this Netlify form ensures submissions are
            captured instantly even on slower connections.
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
